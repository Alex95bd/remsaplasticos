{% load static %}<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ APP_NAME }}{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/gestion.css' %}">
</head>
<body class="auth-body">
  <main class="auth-wrapper">
    <div class="auth-card card shadow-sm border-0">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="brand-mark mx-auto mb-3"><i class="bi bi-box-seam"></i></div>
          <h1 class="h4 fw-bold text-navy mb-1">REMSA Gestión Comercial</h1>
          <p class="text-muted small mb-0">Recipientes y Empaques de México</p>
        </div>
        {% include "partials/messages.html" %}
        {% block content %}{% endblock %}
      </div>
    </div>
  </main>
  <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
