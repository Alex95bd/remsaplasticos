{% extends "base_auth.html" %}
{% block title %}Iniciar sesión · REMSA Gestión{% endblock %}
{% block content %}
<form method="post" novalidate>
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  {% include "partials/form_fields.html" %}
  <button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right me-1"></i> Iniciar sesión</button>
</form>
<div class="text-center mt-3">
  <a href="{% url 'accounts:password_reset' %}" class="small">¿Olvidaste tu contraseña?</a>
</div>
{% endblock %}
